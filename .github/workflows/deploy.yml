name: Kiểm tra dữ liệu và triển khai GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Kiểm tra dữ liệu JSON
        run: |
          if [ -f scripts/validate_data.py ]; then
            python scripts/validate_data.py
          else
            echo "Chưa có scripts/validate_data.py, bỏ qua"
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Chuẩn bị thư mục site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude 'analysis' --exclude 'scripts' --exclude 'docs' --exclude 'bao-cao' --exclude '__pycache__' ./ _site/
          # Gắn mã phiên bản để trình duyệt không dùng bản cũ trong bộ nhớ đệm
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" _site/index.html
          sed -i "s#assets/js/app.js\"#assets/js/app.js?v=${BUILD}\"#; s#assets/css/main.css\"#assets/css/main.css?v=${BUILD}\"#" _site/index.html
          find _site/assets/js -name '*.js' -exec sed -i -E "s#(from \"\.{1,2}/[^\"?]+\.js)\"#\1?v=${BUILD}\"#g" {} +
          grep -rhoE 'from "[^"]+"' _site/assets/js | sort -u
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
